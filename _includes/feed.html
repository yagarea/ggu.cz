<div class="feed">
	{%- for post in site.posts %}
		<article class="feed-post block">
			<h3>{{- post.title -}}</h3>
			<div>{{- post.content -}}</div>
			<div class="feed-author">
				<em>{{- post.author -}}</em>, <em><time datetime="{{ post.date | date_to_xmlschema }}">{{- post.date | date: "%-d. %-m. %Y" -}}</time></em>
			</div>
		</article>
	{%- endfor %}
</div>
