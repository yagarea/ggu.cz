---
layout: default
---

<article class="feed-post">
	<h3>{{ page.title }}</h3>
	<div>{{ content }}</div>
	<div class="feed-author">
		{{ page.author }}
		<br/>
		<i><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></i>
	</div>
</article>
<p>You can subscribe to <a href="/rss.xml">GGU news RSS</a>.</p>
