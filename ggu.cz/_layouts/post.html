---
layout: default
---

<article class="feed-post single-post">
	<header class="post-header">
		<h1>{{ page.title }}</h1>
		<p class="post-meta">
			{{ page.author }} &middot;
			<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
		</p>
	</header>
	<div class="post-content">{{ content }}</div>
</article>
<nav class="post-footer" aria-label="Post navigation">
	<a href="/feed/">&larr; All posts</a>
	<a href="/rss.xml">Subscribe via RSS</a>
</nav>
